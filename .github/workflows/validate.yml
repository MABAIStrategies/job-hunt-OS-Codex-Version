name: Validate

on:
  push:
  pull_request:
  # Re-run every 4 hours so new npm advisories or drift surface without a push.
  # GitHub runs scheduled workflows on the default branch only.
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install web dependencies
        run: npm ci

      - name: Run artifact tests
        run: python -m pytest tests/test_repository_artifacts.py -q

      - name: Validate JSON files
        run: |
          for f in skills/job-hunt-os/schemas/*.json examples/*.json launch/export-manifest.json; do
            python -m json.tool "$f" >/dev/null
          done

      - name: Check migration hygiene
        run: |
          pattern='/home/'"claude"'|/mnt/'"skills"'|/mnt/'"user-data"'|web_'"search"'|web_'"fetch"'|present_'"files"'|Claude '"will"
          ! grep -R -n -E "$pattern" \
            --exclude-dir=.git \
            --exclude-dir=__pycache__ \
            --exclude-dir=.pytest_cache \
            .

      - name: Validate Codex skill frontmatter
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import yaml

          skill = Path("skills/job-hunt-os/SKILL.md")
          content = skill.read_text(encoding="utf-8")
          match = re.match(r"^---\n(.*?)\n---", content, re.DOTALL)
          assert match, "SKILL.md missing YAML frontmatter"
          data = yaml.safe_load(match.group(1))
          assert data["name"] == "job-hunt-os"
          assert isinstance(data["description"], str) and data["description"].strip()
          assert len(content.splitlines()) < 500
          PY

      - name: Audit web dependencies
        run: npm audit --audit-level=moderate

      - name: Build web app
        run: npm run build
